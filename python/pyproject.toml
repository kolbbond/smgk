[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smgk"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jupyter_client>=8", "nbformat>=5"]

[project.scripts]
smgk = "smgk.cli:main"

[tool.setuptools]
packages = ["smgk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
